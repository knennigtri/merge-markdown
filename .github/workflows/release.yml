
# https://github.com/pandoc/pandoc-action-example
# https://github.com/actions/runner-images/issues/482#issuecomment-806539083
# https://github.com/wkhtmltopdf/packaging/releases

name: Build & Publish to NPM and GHP

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [closed]
    paths:
      - 'package.json'
  push:
    branches: 
      - main
    paths:
      - 'package.json'

jobs:
  build:
    # Only run if PR was merged or if pushed directly to main
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write 
    steps:
      # - uses: docker://pandoc/core:2.9
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      # - run: |
      #    sudo apt-get update
      #    sudo apt-get install -y xvfb
      #    sudo apt-get install -y wkhtmltopdf
      - run: npm ci
      # - run: npm test
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write 
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_NEW_TOKEN}}
  publish-ghp:
    needs: build
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write 
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@knennigtri'
      - run:
          echo "//npm.pkg.github.com:_authToken=${{ secrets.GITHUB_TOKEN }}" >
          ~/.npmrc
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
  
  create-release-tag:
    needs: [publish-npm, publish-ghp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Create and push tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
